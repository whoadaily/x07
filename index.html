<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>videy.co - Ready to Play</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #02040a;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    }

    .vl-wrap {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow: hidden;
      background: #02040a;
      color: #e5e7eb;
    }

    .vl-wrap::before, .vl-wrap::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .5;
      pointer-events: none;
      animation: vl-float 14s ease-in-out infinite alternate;
    }
    .vl-wrap::before {
      width: 300px;
      height: 300px;
      top: -80px;
      left: -60px;
      background: #1d4ed8;
    }
    .vl-wrap::after {
      width: 280px;
      height: 280px;
      bottom: -80px;
      right: -50px;
      background: #7c3aed;
      animation-delay: -6s;
    }

    @keyframes vl-float {
      to { transform: translate(30px, 20px) scale(1.1); }
    }

    .vl-grid {
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    .vl-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      padding: 28px 20px 22px;
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 20px;
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      animation: vl-in .6s ease both;
    }

    @keyframes vl-in {
      from { opacity: 0; transform: translateY(18px); }
    }

    .vl-badge {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .04em;
      padding: 5px 12px;
      border-radius: 999px;
      color: #86efac;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.25);
    }

    .vl-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 6px;
      border-radius: 50%;
      background: #22c55e;
      animation: vl-pulse 1.6s infinite;
    }

    @keyframes vl-pulse {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6); }
      100% { box-shadow: 0 0 0 7px rgba(34, 197, 94, 0); }
    }

    .vl-title {
      margin: 14px 0 8px;
      font-size: clamp(28px, 8vw, 42px);
      font-weight: 900;
      letter-spacing: -.02em;
      color: #60a5fa;
      background: linear-gradient(90deg, #60a5fa, #a78bfa, #60a5fa);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: vl-shine 5s linear infinite;
      word-break: break-word;
    }

    @keyframes vl-shine {
      to { background-position: 200% center; }
    }

    .vl-sub {
      margin: 0 auto 18px;
      max-width: 100%;
      font-size: 14px;
      line-height: 1.5;
      color: #b6bdc9;
    }

    .vl-timer {
      margin: 0 0 16px;
      font-size: 13px;
      color: #94a3b8;
      min-height: 18px;
    }
    .vl-timer b { color: #fff; }

    .vl-list {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .vl-btn {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      background: linear-gradient(135deg, #1f2937, #374151);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform .15s ease, box-shadow .15s ease;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .vl-btn .ico { margin-right: 8px; font-size: 17px; }
    .vl-btn.primary {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      border-color: rgba(147, 197, 253, 0.4);
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.4);
    }
    .vl-btn:active { transform: scale(.97); }
    .vl-btn .arrow { margin-left: auto; opacity: .7; }
    .vl-btn.locked { pointer-events: none; opacity: .45; }

    .vl-copy {
      margin-top: 6px;
      background: none;
      border: 0;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      color: #8b95a7;
      text-decoration: underline;
      padding: 6px;
    }
    .vl-copy:active { color: #fff; }

    .vl-foot {
      margin-top: 16px;
      font-size: 12px;
      color: #667085;
    }
  </style>
</head>

<body>

  <div class="vl-wrap">
    <div class="vl-grid"></div>
    <div class="vl-card">
      <span class="vl-badge"><span class="vl-dot"></span>Video ready to play</span>
      <h1 class="vl-title" id="vl-brand">videy.co</h1>
      <p class="vl-sub">Your video is ready to play. If one link doesn&#39;t work, try another available link below 👇</p>
      <p class="vl-timer" id="vl-timer"></p>
      <div class="vl-list" id="vl-list"></div>
      <button class="vl-copy" id="vl-copy" type="button">Copy this page link</button>
      <div class="vl-foot" id="vl-foot"></div>
    </div>
  </div>

  <script>
    (function () {
      /* ================= CONFIG: EDIT DI SINI ================= */
      var BRAND     = "videy.co";
      var FOOTER    = "Powered by videy.co";
      var COUNTDOWN = 5;      // Detik hitung mundur (0 = langsung aktif)
      var NEW_TAB   = true;   // Buka link di tab baru
      var LINKS = [
        { label: "Play Video",   icon: "▶",  url: "https://davidselesas-commits.github.io/vidoslks/" },
        { label: "Video Link 2", icon: "🔥", url: "https://davidselesas-commits.github.io/korenasd/" },
        { label: "Video Link 3", icon: "💎", url: "https://cdn.videy.co/AzT14F5w1.mp4" },
        { label: "Video Link 4", icon: "🎬", url: "https://cdn.videy.co/BtbDZjlT1.mp4" }
      ];
      /* ======================================================== */

      function $(id) { return document.getElementById(id); }
      function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) { e.className = cls; }
        if (text) { e.textContent = text; }
        return e;
      }

      var brandEl = $("vl-brand");
      if (!brandEl) return;
      brandEl.textContent = BRAND;
      $("vl-foot").textContent = FOOTER;

      var list = $("vl-list");
      var buttons = [];
      for (var i = 0; i < LINKS.length; i++) {
        var l = LINKS[i];
        var a = el("a", i === 0 ? "vl-btn primary" : "vl-btn");
        a.href = l.url;
        a.rel = "noopener noreferrer nofollow";
        if (NEW_TAB) { a.target = "_blank"; }
        a.appendChild(el("span", "ico", l.icon));
        a.appendChild(el("span", "txt", l.label));
        a.appendChild(el("span", "arrow", "→"));
        list.appendChild(a);
        buttons.push(a);
      }

      var timer = $("vl-timer");

      function showCount(n) {
        timer.textContent = "";
        timer.appendChild(document.createTextNode("Links active in "));
        timer.appendChild(el("b", "", String(n)));
        timer.appendChild(document.createTextNode(" sec…"));
      }

      function unlock() {
        for (var k = 0; k < buttons.length; k++) {
          buttons[k].className = buttons[k].className.replace(" locked", "");
        }
        timer.textContent = "✔ Links are active";
      }

      if (COUNTDOWN > 0) {
        for (var j = 0; j < buttons.length; j++) {
          buttons[j].className += " locked";
        }
        var left = COUNTDOWN;
        showCount(left);
        var t = setInterval(function () {
          left = left - 1;
          if (left > 0) {
            showCount(left);
          } else {
            clearInterval(t);
            unlock();
          }
        }, 1000);
      } else {
        unlock();
      }

      $("vl-copy").addEventListener("click", function () {
        var btn = this;
        var done = function () {
          btn.textContent = "✔ Copied!";
          setTimeout(function () { btn.textContent = "Copy this page link"; }, 1800);
        };
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(location.href).then(done).catch(function() { fallbackCopy(done); });
        } else {
          fallbackCopy(done);
        }
      });

      function fallbackCopy(done) {
        var ta = document.createElement("textarea");
        ta.value = location.href;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try {
          document.execCommand("copy");
          done();
        } catch (err) {}
        document.body.removeChild(ta);
      }
    })();
  </script>

</body>
</html>
